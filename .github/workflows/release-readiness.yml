name: Release readiness

on:
  workflow_dispatch:
  push:
    branches:
      - mvp2-chitra-final-port
  pull_request:
    branches:
      - MVP2

permissions:
  contents: read

jobs:
  installer-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installer unit and contract tests
        run: python -m unittest discover -s installer -p "test_*.py"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:frontend
      - run: npm run test:runtime
      - name: Production frontend build
        run: |
          cp .env.local.example .env.local
          npm run build

  backend-cpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install validated CPU and test manifests
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install --disable-pip-version-check -r backend/requirements.txt
          backend/.venv/Scripts/python.exe -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
      - name: Backend tests
        run: npm run test:backend

  windows-release:
    needs:
      - installer-contracts
      - frontend
      - backend-cpu
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish self-contained MIT CAD converter
        shell: pwsh
        run: |
          dotnet publish tools/dwg2dxf/Dwg2Dxf.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output tools/dwg2dxf/dist/win-x64
          if (-not (Test-Path tools/dwg2dxf/dist/win-x64/dwg2dxf-acadsharp.exe)) {
            throw "The self-contained CAD converter was not produced."
          }
          Copy-Item tools/dwg2dxf/THIRD_PARTY_NOTICES.md `
            tools/dwg2dxf/dist/win-x64/ACADSHARP_NOTICE.md
          $runtimeLicense = Get-ChildItem $env:DOTNET_ROOT `
            -Filter LICENSE.txt -File -Recurse | Select-Object -First 1
          $runtimeNotices = Get-ChildItem $env:DOTNET_ROOT `
            -Filter ThirdPartyNotices.txt -File -Recurse | Select-Object -First 1
          if (-not $runtimeLicense -or -not $runtimeNotices) {
            throw "The .NET runtime license notices could not be located."
          }
          Copy-Item $runtimeLicense.FullName `
            tools/dwg2dxf/dist/win-x64/DOTNET_LICENSE.txt
          Copy-Item $runtimeNotices.FullName `
            tools/dwg2dxf/dist/win-x64/DOTNET_THIRD_PARTY_NOTICES.txt
      - name: Assemble dependency-clean installer source ZIP
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "qtracx-release"
          $package = Join-Path $stage "QTracX"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          & robocopy . $package /E /NFL /NDL /NJH /NJS /NP `
            /XD .git node_modules .next .pytest_cache __pycache__ `
                backend\.venv backend\.venv-gpu `
            /XF .env.local *.pyc
          if ($LASTEXITCODE -gt 7) { throw "robocopy failed: $LASTEXITCODE" }
          $zip = Join-Path $PWD "QTracX-windows-x64.zip"
          Compress-Archive -Path $package -DestinationPath $zip -CompressionLevel Optimal
          (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant() + `
            "  QTracX-windows-x64.zip" | `
            Set-Content -Encoding ascii "$zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: QTracX-windows-x64-${{ github.sha }}
          path: |
            QTracX-windows-x64.zip
            QTracX-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
